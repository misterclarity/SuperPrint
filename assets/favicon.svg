<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    SuperPrint mark: a six-petal bloom caught half-coloured — three petals
    filled, three still waiting.
    Every petal is opaque (the pale ones are filled with the background, not
    left hollow) so they layer cleanly instead of showing through each other.
    Solid shapes also carry the silhouette down to 16px, where fine linework
    would vanish.
  -->
  <rect width="64" height="64" rx="14" fill="#f6f2ea"/>
  <g stroke="#1c1915" stroke-width="3" stroke-linejoin="round">
    <path d="M32 34C23 28 22 15 32 7C42 15 41 28 32 34Z" fill="#fffdf8"/>
    <path d="M32 34C23 28 22 15 32 7C42 15 41 28 32 34Z" fill="#fffdf8" transform="rotate(60 32 32)"/>
    <path d="M32 34C23 28 22 15 32 7C42 15 41 28 32 34Z" fill="#fffdf8" transform="rotate(120 32 32)"/>
    <path d="M32 34C23 28 22 15 32 7C42 15 41 28 32 34Z" fill="#b8492c" transform="rotate(180 32 32)"/>
    <path d="M32 34C23 28 22 15 32 7C42 15 41 28 32 34Z" fill="#b8492c" transform="rotate(240 32 32)"/>
    <path d="M32 34C23 28 22 15 32 7C42 15 41 28 32 34Z" fill="#b8492c" transform="rotate(300 32 32)"/>
  </g>
  <circle cx="32" cy="32" r="5.8" fill="#1c1915"/>
  <circle cx="32" cy="32" r="1.9" fill="#f6f2ea"/>
</svg>
