name: Deploy to GitHub Pages

# NOTE: this workflow only does anything when Settings -> Pages -> Source is set
# to "GitHub Actions". If Pages is set to "Deploy from a branch" (as it is at
# the time of writing), GitHub runs its own built-in "pages build and
# deployment" job on every push to the selected branch and this file stays
# dormant. Tests run separately, on every branch, via ci.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run generator tests
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The site is plain static files — no build step, upload the repo as-is.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
